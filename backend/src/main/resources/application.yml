# All environment-specific values come from env vars (see /.env.example).
# Defaults below are for local development only.
spring:
  application:
    name: familymap-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:familymap}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:familymap}
    password: ${DB_PASSWORD:familymap}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

familymap:
  jwt:
    # Base64-encoded HMAC key, at least 256 bits. Generate with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  cors:
    # Comma-separated origins. "*" is fine for local dev; lock down in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

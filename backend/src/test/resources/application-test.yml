# Test profile: H2 in MySQL-compatibility mode so the real Flyway migrations run without Docker.
spring:
  datasource:
    url: jdbc:h2:mem:familymap;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

familymap:
  jwt:
    # Test-only key (base64 of 48 random bytes). Never use in a real deployment.
    secret: dGVzdC1vbmx5LXNlY3JldC1mb3ItZmFtaWx5bWFwLWp3dC1zaWduaW5nLWtleS0xMjM0NTY=
